<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Registration</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Student Registration</h1>
    <p>Fill in your academic details.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="notice {{ category }}">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token"
               value="{{ csrf_token() }}">

        <h2>Personal Information</h2>

        <label>First Name *
            <input name="first_name" maxlength="80" required>
        </label>

        <label>Last Name *
            <input name="last_name" maxlength="80" required>
        </label>

        <label>Email *
            <input type="email" name="email" maxlength="254" required>
        </label>

        <label>Mobile Number *
            <input type="tel" name="phone"
                   pattern="[6-9][0-9]{9}"
                   maxlength="10" required>
        </label>

        <h2>Academic Information</h2>

        <label>Course *
            <select name="course" required>
                <option value="">Select Course</option>
                <option>Diploma</option>
                <option>B.Tech</option>
                <option>BCA</option>
                <option>MCA</option>
            </select>
        </label>

        <label>Branch *
            <select name="branch" required>
                <option value="">Select Branch</option>
                <option>Computer Science Engineering</option>
                <option>Information Technology</option>
                <option>Civil Engineering</option>
                <option>Mechanical Engineering</option>
                <option>Electrical Engineering</option>
            </select>
        </label>

        <label>Semester *
            <select name="semester" required>
                <option value="">Select Semester</option>
                <option>1st Semester</option>
                <option>2nd Semester</option>
                <option>3rd Semester</option>
                <option>4th Semester</option>
                <option>5th Semester</option>
                <option>6th Semester</option>
            </select>
        </label>

        <label>Enrollment Number
            <input name="enrollment" maxlength="100">
        </label>

        <h2>Create Account</h2>

        <label>Password *
            <input type="password" name="password"
                   minlength="8" autocomplete="new-password" required>
        </label>

        <label>Confirm Password *
            <input type="password" name="confirm_password"
                   minlength="8" autocomplete="new-password" required>
        </label>

        <label class="terms">
            <input type="checkbox" required>
            I confirm that my information is correct.
        </label>

        <button type="submit">Register Student</button>
        <a href="{{ url_for('admin_login') }}">Admin Login</a>
    </form>
</div>
</body>
</html>
